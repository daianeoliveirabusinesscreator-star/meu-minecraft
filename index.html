<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Bloco</title>
    <style>
        body { margin: 0; background: #87CEEB; text-align: center; font-family: sans-serif; padding-top: 50px; }
        h1 { color: #fff; text-shadow: 2px 2px #000; }
        canvas { background: #556B2F; display: block; margin: 20px auto; border: 4px solid #fff; box-shadow: 0px 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <h1>Meu Código Inicial</h1>
    <canvas id="quadrado" width="200" height="200"></canvas>
    <script>
        const canvas = document.getElementById('quadrado');
        const ctx = canvas.getContext('2d');
        // Desenha o bloco de terra do Minecraft (Marrom)
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(50, 50, 100, 100);
    </script>
</body>
</html>
